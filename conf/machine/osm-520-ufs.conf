require conf/machine/include/mt8391.inc
require conf/machine/include/mt7921.inc
require conf/machine/include/mt7925.inc
require conf/machine/include/osm-520.inc

# Kernel
KERNEL_DEVICETREE = "mediatek/osm-520_mtk520.dtb"

# U-Boot
UBOOT_MACHINE = "osm_520_ufs_defconfig"
UBOOT_DTB_NAME = "osm-520-ufs.dtb"

# libdram
LIBDRAM_BOARD_NAME = "genio-720-evk"

# OP-TEE
OPTEE_DRAM_SIZE = "0x200000000"

# LK
LK_BOARD_NAME = "${LIBDRAM_BOARD_NAME}"

# UFS storage
WIC_SECTOR_SIZE = "4096"
WIC_BLOCK_SIZE = "4096"
MACHINE_FEATURES:append = " ufs-boot ufs-system"

MACHINE_FEATURES:append = " alsa bluetooth pci usbgadget usbhost wifi tsn uc-fde"

MACHINEOVERRIDES =. "mt8391-evk:genio-720-evk:mt8391-evk-ufs:genio-720-evk-ufs:"

# onsemi-firmware
ONSEMI_BOARD_NAME = "MediaTek_Genio"
