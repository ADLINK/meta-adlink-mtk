require conf/machine/include/mt8391.inc
require conf/machine/include/mt7921.inc
require conf/machine/include/mt7925.inc
require conf/machine/include/ubifs-macronix-mx25u12832F.inc
require conf/machine/include/osm-520.inc

# Kernel
KERNEL_DEVICETREE = "mediatek/osm-520_mtk520.dtb"

# U-Boot
UBOOT_MACHINE = "osm_520_ufs_qspi_defconfig"
UBOOT_DTB_NAME = "osm-520-ufs-qspi.dtb"

# libdram
LIBDRAM_BOARD_NAME = "genio-720-evk"

# OP-TEE
OPTEE_DRAM_SIZE = "0x200000000"

# LK
LK_PROJECT = "mt8391-evk-norboot-ufs"
LK_BOARD_NAME = "${LK_PROJECT}"

# Trusted Firmware-A
TFA_NOR_FIP_ADDR = "0x200000"
TFA_NOR_FIP_LENGTH = "0x200000"
TFA_NOR_DRAMK_ADDR = "0xA00000"
TFA_NOR_MISC_ADDR = "0xA80000"

OVERRIDES .= ":nor-boot"

MACHINE_FEATURES:append = " nor-boot"
MACHINE_FEATURES:append = " alsa bluetooth pci usbgadget usbhost wifi tsn uc-fde"

MACHINEOVERRIDES =. "mt8391-evk:genio-720-evk:mt8391-evk-norboot-ufs:genio-720-evk-norboot-ufs:"

# onsemi-firmware
ONSEMI_BOARD_NAME = "MediaTek_Genio"
